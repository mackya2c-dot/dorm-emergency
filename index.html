<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#14213D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="緊急対応">
<title>緊急時対応ガイド</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="bar">
  <div class="bar-title" id="appTitle">緊急時対応ガイド</div>
  <button class="lang" id="langBtn" type="button" aria-label="Language">EN</button>
</header>
<div id="banner" class="banner" hidden></div>
<main id="view" class="view" tabindex="-1"></main>
<nav class="tabs" id="tabs" hidden>
  <button type="button" data-tab="home" id="tabHome">ホーム</button>
  <button type="button" data-tab="contacts" id="tabContacts">電話帳</button>
  <button type="button" data-tab="settings" id="tabSettings">設定</button>
</nav>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<noscript>JavaScriptを有効にしてください / Please enable JavaScript.</noscript>
<script src="app.js"></script>

</html>
